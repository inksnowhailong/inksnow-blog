# 用于将静态内容部署到 GitHub Pages 的简单工作流
name: Deploy static content to Pages

on:
  # 在推送到默认分支时运行
  push:
    branches: ["master"]

  # 允许从 Actions 选项卡手动运行此工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 仅允许一个并发部署，跳过正在进行的运行和最新排队之间排队的运行。
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 单个部署作业，因为我们只是部署
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 选择要使用的 pnpm 版本
          version: 9
          # 使用 pnpm 安装依赖
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # 或者根据项目需求指定其他 Node.js 版本
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: npm run build # 执行打包命令

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传整个仓库
          path: "./docs/.vuepress/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # 步骤 5：上传构建文件到服务器

      - name: Deploy to Server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}  # 使用 SSH 密钥进行安全连接
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}  # 服务器 IP 地址
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

          # 设置 SSH 密钥
          echo "$DEPLOY_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          # 用 rsync 增量同步，不再 scp -r 全量推。
          # 旧做法每次把 24MB / 249 个文件从美国的 runner 逐个传到北京，
          # 实测占掉整条流水线 76% 的时间（249s / 327s），而真正变化的通常只有几十 KB。
          #
          # 这一条刻意不加 --delete：服务器上有仓库里没有的文件
          #（手动传过的图之类），全量镜像会把它们抹掉。
          rsync -az --no-owner --no-group \
            -e "ssh -i private_key.pem" \
            ./docs/.vuepress/dist/ $SERVER_USER@$SERVER_IP:/www/wwwroot/inksnowhl.cn/

          # assets 单独做精确镜像。这里的文件名都带 content hash，每次构建都换一批，
          # 只增不删的话会无限堆积——这个目录一度涨到 554MB，而当前构建只需要几 MB。
          # 代价是：正好缓存着旧 HTML 的访客会短暂 404，刷新即恢复。
          rsync -az --delete --no-owner --no-group \
            -e "ssh -i private_key.pem" \
            ./docs/.vuepress/dist/assets/ $SERVER_USER@$SERVER_IP:/www/wwwroot/inksnowhl.cn/assets/

          # rsync 以登录用户身份落盘，属主得交还给 nginx 运行的那个用户
          ssh -i private_key.pem $SERVER_USER@$SERVER_IP << 'EOF'
            set -e
            chown -R www:www /www/wwwroot/inksnowhl.cn
            nginx -t && systemctl reload nginx
          EOF

          # 部署后自检。不能用状态码判断：nginx 配了找不到就回首页的兜底，
          # 任何路径都是 200，靠状态码的检查永远通过、等于没检查。
          # 改为取本次构建才有的那个带 hash 的入口 js——它存在，才证明
          # 这一版真的落到服务器上了；没传成功就会被兜底成 text/html。
          MAIN_JS=$(basename $(ls ./docs/.vuepress/dist/assets/app-*.js | head -1))
          CT=$(curl -s -o /dev/null -w "%{content_type}" --max-time 20             "https://inksnowhl.cn/inksnow-blog/assets/$MAIN_JS")
          echo "assets/$MAIN_JS -> $CT"
          case "$CT" in
            *javascript*) echo "本次构建已生效" ;;
            *) echo "服务器上没有这一版的 $MAIN_JS，同步没成功"; exit 1 ;;
          esac

